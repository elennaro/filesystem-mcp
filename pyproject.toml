[project]
name = "mcp-filesystem"
version = "0.1.0"
description = "MCP filesystem server — Python port of the Official MCP TypeScript filesystem server"
requires-python = ">= 3.10"
license = { text = "MIT" }

# Portions of this software are based on modelcontextprotocol/servers
# (https://github.com/modelcontextprotocol/servers), licensed under MIT.

dependencies = [
    "fastmcp>=0.4.0",
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_filesystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
